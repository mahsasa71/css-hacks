<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="container">
        <div class="accordian accordian--open">
            <div class="accordian-header accordian-header--open">
                <h6 class="accordian-title">Lorem ipsum dolor sit amet.</h6>
            </div>

            <div class="accordianbody">
            <p class="accordiantext">
Lorem ipsum dolor sit amet consectetur adipisicing elit. At, ab?
            </p>
            </div>

            <div class="accordian-icon">
                <svg class="accordianiconadd" width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
<path opacity="0.4" d="M4.5 9H13.5" stroke="#05A6A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M9 13.5V4.5" stroke="#05A6A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>


<svg class="accordianiconminus" width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M4.5 9H13.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

            </div>
        </div>
    </div>
    <script>
        let acheader=document.querySelector(".accordian-header")
        acheader.addEventListener("click",()=>{
document.querySelector(".accordian").classList.toggle("accordian--open")
        }
        )
        
    </script>
</body>
</html>
